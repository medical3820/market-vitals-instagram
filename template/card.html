<title>마켓바이탈 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&display=swap">
<style>
  /* Layout: 딥그린 바탕의 클린 앱형 카드(최대 10장). 1080x1350(4:5) 기준, 치수는 cqw(카드 너비 1%).
     등락은 빨강(상승)/파랑(하락) 칩에 흰 글자. 단일 룩(이미지용). 데이터는 #data JSON 하나로 들어온다. */
  :root{
    --bg:#0e3b2e;        /* 딥그린 바탕 */
    --panel:#185040;     /* 타일·막대 트랙 */
    --fg:#ffffff;        /* 본문 */
    --dim:#a9d3c2;       /* 보조 글자 */
    --line:#2b6553;      /* 구분선 */
    --mark:#7ff0bf;      /* 로고·번호 */
    --up:#e0313a;
    --down:#2563eb;
    --page:#e8eaed;      /* 미리보기 바탕 */
    --f:"Gothic A1","Pretendard","Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;
    --card-w:100%;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{background:var(--page);color:#1c1f24;font-family:var(--f);margin:0}

  .shell{max-width:1180px;margin:0 auto;padding-block:28px 44px;padding-left:16px;padding-right:16px}
  .shell header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:18px}
  .shell h1{font-size:22px;font-weight:900;margin:0}
  .shell header p{margin:0;color:#5f6670;font-size:13px}
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:20px}

  .card{width:var(--card-w);aspect-ratio:4/5;max-width:100%;container-type:inline-size;position:relative;overflow:hidden;
    background:var(--bg);color:var(--fg);box-shadow:0 8px 26px rgba(20,24,30,.14);word-break:keep-all;overflow-wrap:break-word}
  .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:7cqw 7cqw 6cqw}
  .num{font-variant-numeric:tabular-nums}

  .top{display:flex;justify-content:space-between;align-items:center;gap:3cqw;font-size:3cqw;font-weight:700;color:var(--dim)}
  .top b{color:var(--mark);font-weight:900;font-size:3.8cqw;letter-spacing:-.02em}
  .h{font-size:6.6cqw;font-weight:900;line-height:1.24;letter-spacing:-.045em;margin-top:4.6cqw;white-space:pre-line;text-wrap:balance}
  .h.xl{font-size:8cqw;margin-top:6.4cqw}
  .sub{font-size:3.6cqw;color:var(--dim);font-weight:700;margin-top:2.4cqw}

  .chip{display:inline-block;font-size:3cqw;font-weight:800;color:#fff;padding:.7cqw 1.8cqw;border-radius:1.4cqw;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.up{background:var(--up)} .chip.down{background:var(--down)}
  .chip.flat{background:transparent;color:var(--dim);padding-left:0;padding-right:0}

  /* 커버 타일 */
  .grid{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
  .tile{background:var(--panel);border-radius:3.2cqw;padding:3.4cqw 3.8cqw}
  .tile .k{font-size:2.9cqw;font-weight:700;color:var(--dim)}
  .tile .v{font-size:5.8cqw;font-weight:900;letter-spacing:-.03em;margin-top:1.4cqw}
  .tile .c{margin-top:1.2cqw;min-height:4.4cqw}

  /* 지표 행 */
  .rows{margin-top:4.4cqw;display:flex;flex-direction:column}
  .row{display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:2.6cqw 0;border-bottom:.25cqw solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .nm{font-size:3.9cqw;font-weight:800;min-width:0}
  .row .nm small{display:block;font-size:2.6cqw;color:var(--dim);font-weight:700;margin-top:.5cqw}
  .row .r{display:flex;align-items:center;gap:2.4cqw}
  .row .v{font-size:4.8cqw;font-weight:900;letter-spacing:-.02em}
  .row .chip{min-width:15.5cqw;text-align:center}
  .rows.tight .row{padding:1.7cqw 0}
  .rows.tight .v{font-size:4.4cqw}
  .rows.tight .nm{font-size:3.6cqw}
  .rows.dense .row{padding:1.15cqw 0}
  .rows.dense .nm small{display:inline;margin:0 0 0 1.4cqw}
  .grp{margin-top:3.6cqw}
  .grp .gt{font-size:2.8cqw;font-weight:800;color:var(--mark);letter-spacing:.02em}
  .grp .rows{margin-top:1cqw}

  /* 업종 막대 (0 기준 좌우) */
  .sect{margin-top:4.4cqw;display:flex;flex-direction:column;gap:1.5cqw}
  .sb{display:grid;grid-template-columns:19cqw 1fr;align-items:center;gap:2cqw}
  .sb .who{font-size:3.4cqw;font-weight:800;line-height:1.1}
  .sb .who small{display:block;font-size:2.3cqw;color:var(--dim);font-weight:700}
  .axis{position:relative;height:5cqw}
  .axis::before{content:"";position:absolute;left:50%;top:-.6cqw;bottom:-.6cqw;border-left:.25cqw solid var(--dim)}
  .axis .f{position:absolute;top:.6cqw;bottom:.6cqw;border-radius:.8cqw}
  .axis .f.up{background:var(--up);left:50%} .axis .f.down{background:var(--down);right:50%}
  .axis .t{position:absolute;top:50%;transform:translateY(-50%);font-size:2.9cqw;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
  .note{margin-top:3cqw;font-size:2.6cqw;color:var(--dim);font-weight:500;line-height:1.5}

  /* 수급 */
  .flows{margin-top:3.2cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
  .fl{background:var(--panel);border-radius:3cqw;padding:3.2cqw 3.4cqw}
  .fl .mk{font-size:3cqw;font-weight:900;color:var(--mark)}
  .fl .it{margin-top:2cqw}
  .fl .it .nm{display:flex;justify-content:space-between;font-size:2.9cqw;font-weight:800}
  .fl .it .nm span:last-child{font-variant-numeric:tabular-nums}
  .fl .it .nm .up{color:#ff8b8f} .fl .it .nm .down{color:#8fb4ff}
  .fl .ax{position:relative;height:2.6cqw;margin-top:1cqw}
  .fl .ax::before{content:"";position:absolute;left:50%;top:-.3cqw;bottom:-.3cqw;border-left:.2cqw solid var(--dim)}
  .fl .ax .f{position:absolute;top:0;bottom:0;border-radius:.6cqw}
  .fl .ax .f.up{background:var(--up);left:50%} .fl .ax .f.down{background:var(--down);right:50%}

  /* 뉴스 */
  .news{margin-top:3.2cqw;display:flex;flex-direction:column}
  .nw{display:grid;grid-template-columns:6cqw 1fr;gap:2.2cqw;padding:2.6cqw 0;border-bottom:.25cqw solid var(--line)}
  .nw:last-child{border-bottom:0}
  .nw .n{font-size:5cqw;font-weight:900;color:var(--mark);line-height:1}
  .nw .hh{font-size:3.7cqw;font-weight:800;line-height:1.3}
  .nw .d{font-size:2.85cqw;color:var(--dim);font-weight:500;line-height:1.5;margin-top:.7cqw}
  .nw .s{font-size:2.3cqw;color:var(--dim);font-weight:700;margin-top:.6cqw;opacity:.85}

  /* 일정 */
  .sched{margin-top:4.4cqw;display:flex;flex-direction:column}
  .sc{display:grid;grid-template-columns:auto 1fr auto;gap:3cqw;align-items:center;padding:3cqw 0;border-bottom:.25cqw solid var(--line)}
  .sc:last-child{border-bottom:0}
  .sc .tm{font-size:4.2cqw;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:12cqw}
  .sc .it{font-size:3.6cqw;font-weight:700;line-height:1.35}
  .sc .rg{font-size:2.6cqw;font-weight:800;color:var(--bg);background:var(--mark);border-radius:1.2cqw;padding:.6cqw 1.6cqw;white-space:nowrap}

  /* 마무리 */
  .lead{font-size:7.8cqw;font-weight:900;line-height:1.3;letter-spacing:-.045em;margin-top:9cqw;white-space:pre-line}
  .rules{margin-top:6cqw;display:flex;flex-direction:column;gap:2.4cqw}
  .rules div{background:var(--panel);border-radius:2.4cqw;padding:3.4cqw 4cqw;font-size:3.6cqw;font-weight:700}
  .handle{margin-top:auto;font-size:4.6cqw;font-weight:900;color:var(--mark);letter-spacing:-.02em}

  /* 왜 움직였나: 숫자 카드 아래 뉴스 근거 한 줄 */
  .why{margin-top:3cqw;background:var(--panel);border-radius:2.4cqw;padding:2.4cqw 3.4cqw;display:grid;grid-template-columns:auto 1fr;gap:.6cqw 2.4cqw;align-items:baseline}
  .why b{font-size:2.7cqw;font-weight:900;color:var(--mark);white-space:nowrap}
  .why span{font-size:3.1cqw;font-weight:700;line-height:1.4}
  .why small{grid-column:2;font-size:2.3cqw;color:var(--dim);font-weight:700}
  /* '왜?' 한 줄이 있는 카드는 간격을 좁혀 한 장에 들어가게 */
  .has-why .h{font-size:6.2cqw;margin-top:3.8cqw}
  .has-why .rows{margin-top:3.4cqw}
  .has-why .rows .row{padding:2cqw 0}
  .has-why .rows.tight .row{padding:1.25cqw 0}
  .has-why .rows.tight .nm small{display:none}
  .has-why .flows{margin-top:2.4cqw}
  .has-why .fl{padding:2.4cqw 3cqw}
  .has-why .fl .it{margin-top:1.2cqw}
  .has-why .why{margin-top:2.4cqw}
  /* 간밤 해외 지표 결과: 실제 값 크게, 예상·이전 작게, 예상 대비 꼬리표 */
  .res{margin-top:3.6cqw;display:flex;flex-direction:column}
  .rs{display:grid;grid-template-columns:auto 1fr auto;gap:1cqw 2.6cqw;align-items:center;padding:2.4cqw 0;border-bottom:.25cqw solid var(--line)}
  .rs:last-child{border-bottom:0}
  .rs .rg{grid-row:span 2;font-size:2.6cqw;font-weight:800;color:var(--bg);background:var(--mark);border-radius:1.2cqw;padding:.6cqw 1.6cqw;white-space:nowrap}
  .rs .it{font-size:3.5cqw;font-weight:800;line-height:1.3}
  .rs .ac{grid-row:span 2;text-align:right;font-size:5.4cqw;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
  .rs .fp{font-size:2.7cqw;color:var(--dim);font-weight:700}
  .rs .tg{display:inline-block;margin-left:1.2cqw;font-size:2.4cqw;font-weight:800;padding:.3cqw 1.2cqw;border-radius:1cqw;background:var(--panel);color:var(--fg)}
  .res-src{margin-top:2cqw;font-size:2.3cqw;color:var(--dim);font-weight:700}
  /* 나라별 한 줄 */
  .ctry{margin-top:4cqw;display:flex;flex-direction:column;gap:2.2cqw}
  .ct{background:var(--panel);border-radius:2.6cqw;padding:2.8cqw 3.4cqw;display:grid;grid-template-columns:13cqw 1fr;gap:.8cqw 2.6cqw;align-items:baseline}
  .ct b{font-size:3.6cqw;font-weight:900;color:var(--mark)}
  .ct span{font-size:3.5cqw;font-weight:700;line-height:1.4}
  .ct small{grid-column:2;font-size:2.3cqw;color:var(--dim);font-weight:700}
  /* 행이 많고 '왜?'까지 있는 카드 */
  .has-why .rows.dense .row{padding:.75cqw 0}
  .has-why .grp{margin-top:2.6cqw}
  /* 렌더러가 넘침을 감지하면 붙이는 한 단계 더 촘촘한 모양 */
  .squeeze .h{font-size:5.6cqw;margin-top:3cqw}
  .squeeze .rows .row,.squeeze .rows.tight .row,.squeeze .rows.dense .row{padding:.6cqw 0}
  .squeeze .grp{margin-top:2cqw}
  .squeeze .nw{padding:1.8cqw 0}
  .squeeze .why{margin-top:1.8cqw;padding:1.8cqw 3cqw}
  /* 사진 표지: 위는 주제 사진, 아래로 어두워지는 바탕 위에 가운데 큰 글씨 + 강조색 */
  .card.photo{background:#000}
  .photo .ph{position:absolute;left:0;right:0;top:0;height:68%;background-size:cover;background-position:center}
  .photo .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 70%,#000 100%)}
  .photo .in{justify-content:flex-end;text-align:center;padding-bottom:5cqw}
  .photo .tp{position:absolute;left:6cqw;right:6cqw;top:5.5cqw;display:flex;justify-content:space-between;font-size:3.2cqw;font-weight:800;color:#fff;text-shadow:0 .3cqw 1.6cqw rgba(0,0,0,.6)}
  .photo .tp b{color:var(--hot,#ff4f9a);font-weight:900}
  .photo .hl{font-size:8.2cqw;font-weight:900;line-height:1.2;letter-spacing:-.05em;color:#fff;white-space:pre-line;text-wrap:balance}
  .photo .hl em{font-style:normal;color:var(--hot,#ff4f9a)}
  .photo .sb2{margin-top:2.6cqw;font-size:7cqw;font-weight:900;line-height:1.2;letter-spacing:-.05em;color:var(--hot,#ff4f9a);white-space:pre-line}
  .photo .hl,.photo .sb2,.photo .sw,.photo .tp{position:relative;z-index:1}
  .photo .tp{position:absolute}
  .photo .sw{margin-top:6cqw;font-size:3.6cqw;font-weight:800;color:#fff}
  /* 사진 표지 B(잡지형): 사진 꽉 채움, 아래 왼쪽 정렬 — 맥락 한 줄 / 두 줄 제목 / 강조색 보조 줄 / 짧은 막대 + 계정 */
  .card.mag{background:#000}
  .mag .ph{position:absolute;inset:0;background-size:cover;background-position:center}
  .mag .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 70%,rgba(0,0,0,.92) 100%)}
  .mag .in{justify-content:flex-end;padding-bottom:6cqw}
  .mag .in>*:not(.ph):not(.dtop){position:relative;z-index:1}
  .mag .dtop{position:absolute;left:0;right:0;top:36%;transform:translateY(-50%);z-index:1;text-align:center;font-variant-numeric:tabular-nums}
  .mag .dtop b{display:inline-block;font-size:11cqw;font-weight:900;letter-spacing:-.03em;line-height:1.1;color:var(--dc,#ffd43b);text-shadow:0 .5cqw 3cqw rgba(0,0,0,.75)}
  .mag .dtop small{display:table;margin:2.2cqw auto 0;font-size:3.6cqw;font-weight:900;color:#fff;background:var(--hot,#ff3d6e);padding:1cqw 3cqw;border-radius:99cqw}
  .mag.boxed .dtop b{color:#fff;background:var(--hot,#ff3d6e);padding:1cqw 4cqw;border-radius:2.4cqw;text-shadow:none}
  .mag.boxed .dtop small{background:rgba(0,0,0,.6)}
  .mag .ph::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));z-index:1}
  .mag .cx{font-size:3cqw;font-weight:800;color:#d9d9d9}
  .mag .hl{margin-top:1.6cqw;font-size:8.6cqw;font-weight:900;line-height:1.18;letter-spacing:-.05em;color:#fff;white-space:pre-line}
  .mag .sb2{margin-top:2.2cqw;font-size:3.4cqw;font-weight:800;color:var(--hot,#ff5a6e)}
  .mag .hd{margin-top:5cqw;display:flex;align-items:center;gap:2cqw;font-size:2.8cqw;font-weight:700;color:#cfcfcf}
  .mag .hd i{display:block;width:7cqw;height:.5cqw;background:#fff}
  /* 글자만 있는 표지: 날짜 + 브리핑 이름 + 그날 뉴스로 쓴 궁금증 문구 */
  .title .dt{margin-top:11cqw;font-size:9.6cqw;font-weight:900;color:var(--mark);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .title .nm{font-size:7.4cqw;font-weight:900;letter-spacing:-.045em;margin-top:1.2cqw}
  .title .bar{width:14cqw;height:1.1cqw;background:var(--mark);border-radius:1cqw;margin-top:8cqw}
  .title .hk{font-size:9cqw;font-weight:900;line-height:1.22;letter-spacing:-.05em;margin-top:5cqw;white-space:pre-line;text-wrap:balance}
  .title .foot{margin-top:3cqw}
  .title .go{margin-top:auto;font-size:3.6cqw;font-weight:800;color:var(--dim)}
  /* 마지막 카드 하단 띠: 다음 게시물 예고 + 팔로우 안내 */
  .cta{margin-top:auto;border:.4cqw solid var(--mark);border-radius:2.6cqw;padding:2.4cqw 3.4cqw;display:flex;flex-direction:column;gap:.6cqw}
  .cta b{font-size:3.6cqw;font-weight:900;color:var(--fg)}
  .cta span{font-size:2.9cqw;font-weight:800;color:var(--mark)}
  .cta + .foot{margin-top:2.2cqw}
  .outro:has(.cta) .handle{display:none}
  .foot{margin-top:auto;padding-top:2.6cqw;display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;font-size:2.4cqw;color:var(--dim);font-weight:700;line-height:1.4}
  .foot span:last-child{white-space:nowrap}
  .cover .foot,.outro .foot{margin-top:3cqw}

  /* 렌더 모드: 렌더러가 html.render + --card-w:1080px 로 한 장씩 촬영 */
  .render body{background:var(--bg)}
  .render .shell{max-width:none;padding:0}
  .render .shell header{display:none}
  .render .deck{display:block}
  .render .card{box-shadow:none}
</style>

<div class="shell">
  <header>
    <h1>마켓바이탈 카드</h1>
    <p id="meta"></p>
  </header>
  <div class="deck" id="deck"></div>
</div>

<script id="data" type="application/json">/*DATA*/</script>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  // 요일별 배경색 (scripts/themes.mjs). 없으면 기본 딥그린.
  if (D.theme) for (const k of ['bg', 'panel', 'line', 'dim', 'mark']) if (D.theme[k]) document.documentElement.style.setProperty('--' + k, D.theme[k]);
  document.getElementById('meta').textContent = `${D.date} · 1080×1350 캐러셀 ${D.cards.length}장`;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const dir = c => c == null ? 'flat' : c > 0 ? 'up' : c < 0 ? 'down' : 'flat';
  const pct = c => `${c > 0 ? '▲ ' : c < 0 ? '▼ ' : ''}${Math.abs(c).toFixed(2)}%`;
  const chip = (c, empty) => c == null ? (empty ? `<span class="chip flat">${esc(empty)}</span>` : '') : `<span class="chip ${dir(c)}">${pct(c)}</span>`;
  const top = c => `<div class="top"><b>${esc(c.label)}</b><span class="num">${esc(D.dateLabel)}</span></div>`;
  const foot = c => `<div class="foot"><span>${c.asof ? '기준: ' + esc(c.asof) : esc(D.handle)}</span><span class="num">${esc(c.page)}</span></div>`;
  const why = c => c.why ? `<div class="why"><b>왜?</b><span>${esc(c.why.t)}</span><small>출처: ${esc(c.why.src)}</small></div>` : '';
  const rows = (list, cls = '') => `<div class="rows ${cls}">${list.map(r => `
    <div class="row"><div class="nm">${esc(r.name)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div>
    <div class="r"><span class="v num">${esc(r.value)}</span>${chip(r.chg)}</div></div>`).join('')}</div>`;

  const R = {
    cover: c => `${top(c)}<div class="h xl">${esc(c.headline)}</div><div class="sub">${esc(c.sub)}</div>
      <div class="grid">${c.tiles.map(t => `<div class="tile"><div class="k">${esc(t.name)}</div>
        <div class="v num">${esc(t.value)}</div><div class="c">${chip(t.chg)}</div></div>`).join('')}</div>${foot(c)}`,

    rows: c => `${top(c)}<div class="h">${esc(c.title)}</div>${rows(c.rows, c.rows.length > 5 ? 'tight' : '')}${why(c)}${foot(c)}`,

    groups: c => `${top(c)}<div class="h">${esc(c.title)}</div>${c.groups.map(g => `
      <div class="grp"><div class="gt">${esc(g.title)}</div>${rows(g.rows, c.groups.reduce((n, x) => n + x.rows.length, 0) > 6 ? 'tight dense' : 'tight')}</div>`).join('')}${why(c)}${foot(c)}`,

    bars: c => {
      const max = Math.max(...c.items.map(i => Math.abs(i.chg)), 0.01);
      return `${top(c)}<div class="h">${esc(c.title)}</div><div class="sect">${c.items.map(i => {
        const w = Math.abs(i.chg) / max * 34, d = dir(i.chg);
        const pos = i.chg >= 0 ? `left:calc(50% + ${w}% + 1.4cqw)` : `right:calc(50% + ${w}% + 1.4cqw)`;
        return `<div class="sb"><div class="who">${esc(i.name)}<small>${esc(i.sub)}</small></div>
          <div class="axis"><div class="f ${d}" style="width:${w}%"></div><div class="t" style="${pos}">${(i.chg > 0 ? '+' : '') + i.chg.toFixed(2)}%</div></div></div>`;
      }).join('')}</div>${c.why ? why(c) : `<div class="note">${esc(c.note)}</div>`}${foot(c)}`;
    },

    flows: c => `${top(c)}<div class="h">${esc(c.title)}</div>${rows(c.rows)}
      <div class="flows">${c.flows.map(f => {
        const max = Math.max(...f.items.map(i => Math.abs(i.value)), 1);
        return `<div class="fl"><div class="mk">${esc(f.market)}</div>${f.items.map(i => {
          const w = Math.abs(i.value) / max * 48, d = dir(i.value);
          return `<div class="it"><div class="nm"><span>${esc(i.name)}</span><span class="${d}">${esc(i.text)}</span></div>
            <div class="ax"><div class="f ${d}" style="width:${w}%"></div></div></div>`;
        }).join('')}</div>`;
      }).join('')}</div>${why(c)}${foot(c)}`,

    news: c => `${top(c)}<div class="h">${esc(c.title)}</div><div class="news">${c.items.map((n, i) => `
      <div class="nw"><div class="n num">${i + 1}</div><div><div class="hh">${esc(n.h)}</div>
      <div class="d">${esc(n.d)}</div><div class="s">출처: ${esc(n.src)}${n.time ? ' · ' + esc(n.time) : ''}</div></div></div>`).join('')}</div>${foot(c)}`,

    schedule: c => `${top(c)}<div class="h">${esc(c.title)}</div><div class="sched">${c.items.map(x => `
      <div class="sc"><div class="tm">${esc(x.time)}</div><div class="it">${esc(x.item)}</div>${x.region ? `<span class="rg">${esc(x.region)}</span>` : '<span></span>'}</div>`).join('')}</div>${foot(c)}`,

    photo: c => `<div class="ph" style="background-image:url('${esc(c.photo)}')"></div>
      <div class="tp"><span><b>마켓바이탈</b> · ${esc(c.date)} ${esc(c.name)}</span><span class="num">${esc(c.page)}</span></div>
      <div class="hl">${c.tag ? `<em>${esc(c.tag)}</em> ` : ''}${esc(c.hook)}</div>
      <div class="sb2">${esc(c.sub)}</div><div class="sw">옆으로 넘겨보세요</div>`,

    mag: c => `<div class="ph" style="background-image:url('${esc(c.photo)}')"></div>
      <div class="cx">${esc(c.context)}</div><div class="hl">${esc(c.hook)}</div><div class="sb2">${esc(c.sub)}</div>
      <div class="hd"><i></i>${esc(D.handle)}</div>${c.top ? `<div class="dtop num"><b>${esc(c.top)}</b><small>${esc(c.topSub || '')}</small></div>` : ''}`,

    title: c => `${top(c)}<div class="dt num">${esc(c.date)}</div><div class="nm">${esc(c.name)}</div>
      <div class="bar"></div><div class="hk">${esc(c.hook)}</div><div class="go">${esc(c.go)}</div>
      <div class="foot"><span>${esc(D.handle)}</span><span class="num">${esc(c.page)}</span></div>`,

    results: c => `${top(c)}<div class="h">${esc(c.title)}</div><div class="res">${c.items.map(x => `
      <div class="rs"><span class="rg">${esc(x.region)}</span><div class="it">${esc(x.item)}</div><div class="ac num">${esc(x.actual)}</div>
      <div class="fp num">예상 ${esc(x.forecast || '-')} · 이전 ${esc(x.previous || '-')}${x.tag ? `<span class="tg">${esc(x.tag)}</span>` : ''}</div></div>`).join('')}</div>
      <div class="res-src">실제 값 출처: ${esc(c.src)}</div>${foot(c)}`,

    countries: c => `${top(c)}<div class="h">${esc(c.title)}</div><div class="ctry">${c.items.map(x => `
      <div class="ct"><b>${esc(x.region)}</b><span>${esc(x.t)}</span><small>출처: ${esc(x.src)}</small></div>`).join('')}</div>${foot(c)}`,

    outro: c => `${top(c)}<div class="lead">${esc(c.lead)}</div>
      <div class="rules">${c.rules.map(r => `<div>${esc(r)}</div>`).join('')}</div>
      <div class="handle">${esc(D.handle)}</div><div class="foot"><span></span><span class="num">${esc(c.page)}</span></div>`,
  };

  document.getElementById('deck').innerHTML = D.cards.map(c => {
    let h = R[c.type](c);
    if (c.cta) { const k = h.lastIndexOf('<div class="foot">'); const band = `<div class="cta"><b>${esc(c.cta.t)}</b><span>${esc(c.cta.s)}</span></div>`; h = k >= 0 ? h.slice(0, k) + band + h.slice(k) : h + band; }
    return `<section class="card ${c.type}${c.why ? ' has-why' : ''}${c.style ? ' ' + c.style : ''}"><div class="in">${h}</div></section>`;
  }).join('');
  document.documentElement.dataset.ready = '1';
})();
</script>
