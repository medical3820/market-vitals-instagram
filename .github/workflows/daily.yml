name: 마켓바이탈 발행

# 흐름: 클라우드 예약 작업(평일 07:00 KST)이 inbox/<날짜>.json(뉴스)을 push
#   → 이 워크플로가 바로 시작 → 숫자·일정 수집 → 카드 만들기·검사 → 렌더링 → 저장소에 올림 → 인스타 발행
# GitHub 예약(cron)은 2~5시간 늦게 돌아 개장 전 발행에 쓸 수 없으므로 push 로 시작한다.
# 수동 실행(Run workflow)은 기본이 '만들어 보기'다. 실제로 올리려면 publish 를 true 로.
# 이 저장소는 공개라 실행 로그도 공개다. 보유 종목(BLOCKLIST)은 secret 에만 두고 절대 출력하지 않는다.

on:
  push:
    paths:
      - "inbox/*.json"
      - "!inbox/*-pm.json"   # 저녁 뉴스는 evening.yml 이 맡는다
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYY-MM-DD (비우면 오늘, 한국 시간)"
        required: false
        default: ""
      publish:
        description: "true 면 인스타에 실제 발행. 기본은 카드만 만들어 보기"
        required: false
        default: "false"

concurrency:
  group: market-vitals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # push 는 실제 발행. 단 커밋 메시지에 [연습] 이 있으면 카드만 만든다 (예약 작업 리허설용)
      PUBLISH: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[연습]')) || github.event.inputs.publish == 'true' }}
      DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 예약 작업이 올린 뉴스 파일 가져오기
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: git checkout "${{ github.sha }}" -- inbox/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 도구 설치
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk ffmpeg > /dev/null

      - name: 토큰·계정 확인 (게시물은 올리지 않음)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECT_USERNAME: market.vitals
        run: node scripts/check_token.mjs

      - name: 숫자·일정 수집
        run: node scripts/fetch_market.mjs work/market.json

      - name: 카드 만들기·검사
        id: build
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
        run: node scripts/build.mjs

      - name: 이미 발행한 날짜인지 확인
        id: dup
        run: |
          if grep -q "^${{ steps.build.outputs.folder }} " published.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "이미 발행된 날짜입니다. 다시 올리지 않습니다."
          fi

      - name: 이미지 렌더링
        run: node scripts/render.mjs "${{ steps.build.outputs.folder }}"

      - name: 릴스·스토리 만들기 (실패해도 카드 게시물은 계속)
        id: reel
        continue-on-error: true
        run: node scripts/make_reel.mjs "${{ steps.build.outputs.folder }}"

      - name: 카드 이미지 보관 (Actions 화면에서 내려받아 확인)
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.build.outputs.folder }}
          path: |
            posts/${{ steps.build.outputs.folder }}/
            posts/${{ steps.build.outputs.folder }}_R/
            posts/${{ steps.build.outputs.folder }}_S/

      - name: 저장소에 올리기 (인스타가 공개 URL에서 이미지를 가져감)
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ inbox/
          git commit -m "카드 ${{ steps.build.outputs.folder }}" || true
          git push origin main
          sleep 20

      - name: 인스타 발행
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py "${{ steps.build.outputs.folder }}"

      - name: 릴스 발행 (피드 공유 끔, 실패해도 계속)
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true' && steps.reel.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py "${{ steps.build.outputs.folder }}_R"

      - name: 스토리 발행 (실패해도 계속)
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true' && steps.reel.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py "${{ steps.build.outputs.folder }}_S"

      - name: 발행 기록 올리기 (실패해도 기록은 남겨 중복 발행을 막음)
        if: always() && env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        run: |
          git add published.txt
          git diff --cached --quiet && exit 0
          git commit -m "발행 기록 ${{ steps.build.outputs.folder }}"
          git push origin main
