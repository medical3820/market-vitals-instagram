name: 뉴스 후보 수집

# 클라우드 예약 작업은 언론사 사이트에 접속할 수 없어서, RSS 후보 수집을 여기서 대신한다.
# 흐름: 예약 작업이 inbox/<날짜>.request 를 push → 이 워크플로가 RSS를 모아 inbox/<날짜>.candidates.txt 를 main 에 올림
#       → 예약 작업이 그 목록에서 뉴스를 고름 → inbox/<날짜>.json push → daily.yml 이 카드를 만들고 발행
# .request / .candidates.txt 는 daily.yml 의 트리거(inbox/*.json)에 걸리지 않는다.

on:
  push:
    paths:
      - "inbox/*.request"
  workflow_dispatch:

concurrency:
  group: news-candidates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "RSS 후보 수집 (요청 파일마다 - 날짜.request 는 아침, 날짜-pm.request 는 저녁)"
        id: c
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'inbox/*.request' 2>/dev/null || true)
          [ -z "$CHANGED" ] && CHANGED=$(ls inbox/$D*.request 2>/dev/null || true)
          FILES=""
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .request); day=${base%-pm}; mode=""; [ "$base" != "$day" ] && mode=pm
            node scripts/news_candidates.mjs "$day" $mode > "inbox/$base.candidates.txt"
            head -1 "inbox/$base.candidates.txt"
            FILES="$FILES inbox/$base.candidates.txt"
          done
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -n "${{ steps.c.outputs.files }}" ] || exit 0
          git add ${{ steps.c.outputs.files }}
          git commit -m "뉴스 후보 ${{ steps.c.outputs.date }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 3; done
