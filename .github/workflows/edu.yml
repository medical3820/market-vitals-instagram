name: 1분 경제 공부 발행

# 화·목 점심(12:00 KST 예약, GitHub 예약은 몇 시간 늦을 수 있음): content/explainers.json 의 다음 편을 캐러셀 + 스토리로 발행.
# 시황이 아닌 오래 두고 보는 설명이라 시간이 조금 늦어도 괜찮다. 뉴스가 필요 없어 예약 작업(클라우드)이 없다.
# 수동 실행은 기본이 '만들어 보기'다. 실제로 올리려면 publish 를 true 로.

on:
  schedule:
    - cron: "0 3 * * 2,4"   # 화·목 12:00 KST
  workflow_dispatch:
    inputs:
      index:
        description: "올릴 편 번호(0부터). 비우면 아직 안 올린 다음 편"
        required: false
        default: ""
      publish:
        description: "true 면 인스타에 실제 발행. 기본은 카드만 만들어 보기"
        required: false
        default: "false"

concurrency:
  group: market-vitals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
      INDEX: ${{ github.event.inputs.index }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 도구 설치 (명령마다 7분 제한, 멈추면 최대 3번 다시 시도)
        timeout-minutes: 15
        run: |
          try() { for i in 1 2 3; do timeout 420 "$@" && return 0; echo "다시 시도 $i: $*"; sleep 5; done; return 1; }
          try npm ci --no-audit --no-fund
          try npx playwright install --with-deps chromium
          try sudo apt-get install -y fonts-noto-cjk ffmpeg > /dev/null

      - name: 토큰·계정 확인 (게시물은 올리지 않음)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECT_USERNAME: market.vitals
        run: node scripts/check_token.mjs

      - name: 설명 카드 만들기
        id: build
        run: node scripts/explainer.mjs

      - name: 이미 발행한 날짜인지 확인
        id: dup
        run: |
          if grep -q "^${{ steps.build.outputs.folder }} " published.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘 설명 편은 이미 발행했습니다."
          fi

      - name: 이미지 렌더링
        run: node scripts/render.mjs "${{ steps.build.outputs.folder }}"

      - name: 스토리 만들기 (실패해도 캐러셀은 계속)
        id: story
        continue-on-error: true
        run: node scripts/make_reel.mjs "${{ steps.build.outputs.folder }}"

      - name: 카드 이미지 보관
        uses: actions/upload-artifact@v4
        with:
          name: edu-${{ steps.build.outputs.folder }}
          path: |
            posts/${{ steps.build.outputs.folder }}/
            posts/${{ steps.build.outputs.folder }}_S/

      - name: 저장소에 올리기
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git commit -m "경제 공부 카드 ${{ steps.build.outputs.folder }}" || true
          git pull --rebase -q origin main
          git push origin main
          sleep 20

      - name: 인스타 발행
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py "${{ steps.build.outputs.folder }}"

      - name: 스토리 발행 (실패해도 계속)
        if: env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true' && steps.story.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py "${{ steps.build.outputs.folder }}_S"

      - name: 발행 기록 올리기
        if: always() && env.PUBLISH == 'true' && steps.dup.outputs.skip != 'true'
        run: |
          git add published.txt
          git diff --cached --quiet && exit 0
          git commit -m "발행 기록 ${{ steps.build.outputs.folder }}"
          git pull --rebase -q origin main
          git push origin main
